aid: elephant-healthcare
name: Elephant Healthcare
description: >-
  Elephant Healthcare is a global health-technology company, headquartered in the
  UK, that partners with governments to digitise and strengthen public health
  systems across Sub-Saharan Africa and South Asia. Its flagship product,
  ElephantOS, is a mobile- and offline-first electronic health record (EHR) that
  streamlines clinical workflows for primary and secondary care facilities,
  serving over 19 million contracted patients across Nigeria, Kenya and Pakistan.
  The company also builds Elephant Nudge, a clinical co-pilot that guides and
  rewards quality of care, and Elephant Platform, an emerging AI-driven
  marketplace that connects clinicians to third-party healthcare software, medical
  devices and supply-chain partners. Elephant is backed by General Catalyst and
  Seedcamp. As of July 2026 the company publishes no public developer API,
  OpenAPI, or developer portal.
